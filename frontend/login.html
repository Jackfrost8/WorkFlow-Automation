<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AICTE Workflow Automation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg border border-slate-200 p-8">
    <div class="text-center mb-6">
      <div class="inline-flex w-14 h-14 bg-blue-900 text-white rounded-full items-center justify-center font-bold text-xl mb-3">
        AICTE
      </div>
      <h2 class="text-2xl font-bold text-slate-900">Sign in to AICTE Portal</h2>
      <p class="text-xs text-slate-500 mt-1">Institutional Approval &amp; Workflow Management</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Email Address</label>
        <input type="email" id="email" required placeholder="officer@aicte.gov.in"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-800">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-800">
      </div>
      <button type="submit"
              class="w-full py-2.5 bg-blue-900 hover:bg-blue-800 text-white font-medium rounded-lg text-sm transition">
        Authenticate
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-200 text-center text-xs text-slate-500">
      <p>Authentication engine will activate in Phase 2.</p>
      <a href="/" class="text-blue-700 hover:underline mt-2 inline-block">&larr; Return to Overview</a>
    </div>
  </div>
  <script src="/static/js/api.js"></script>
</body>
</html>
