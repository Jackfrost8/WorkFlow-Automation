<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AICTE Workflow Automation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="inline-flex w-16 h-16 bg-blue-900 text-white rounded-full items-center justify-center font-bold text-2xl mb-3 shadow-md">
        AICTE
      </div>
      <h2 class="text-2xl font-bold text-slate-900">Sign in to AICTE Portal</h2>
      <p class="text-xs text-slate-500 mt-1">Institutional Approval &amp; Lifecycle Management Platform</p>
    </div>

    <!-- Alert Box -->
    <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-xs font-medium"></div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Email Address</label>
        <input type="email" id="email" required placeholder="user@aicte.gov.in"
               class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-800 transition">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••"
               class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-800 transition">
      </div>

      <button type="submit" id="submit-btn"
              class="w-full py-2.5 bg-blue-900 hover:bg-blue-800 text-white font-medium rounded-lg text-sm shadow transition flex items-center justify-center">
        <span>Sign In</span>
      </button>
    </form>

    <!-- Quick Role Fill for Demos -->
    <div class="mt-6 pt-5 border-t border-slate-200">
      <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider text-center mb-2">
        1-Click Demo Login
      </p>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <button type="button" onclick="fillCredentials('admin@aicte.gov.in')"
                class="px-2 py-1.5 bg-purple-50 hover:bg-purple-100 text-purple-700 font-medium rounded border border-purple-200 transition text-left">
          👑 Admin
        </button>
        <button type="button" onclick="fillCredentials('bureau@aicte.gov.in')"
                class="px-2 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 font-medium rounded border border-blue-200 transition text-left">
          🏛️ Bureau Officer
        </button>
        <button type="button" onclick="fillCredentials('ro.north@aicte.gov.in')"
                class="px-2 py-1.5 bg-sky-50 hover:bg-sky-100 text-sky-700 font-medium rounded border border-sky-200 transition text-left">
          ⚖️ Regional Officer
        </button>
        <button type="button" onclick="fillCredentials('inst.dtu@aicte.gov.in')"
                class="px-2 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-700 font-medium rounded border border-amber-200 transition text-left">
          🎓 Institution (DTU)
        </button>
      </div>
    </div>

    <!-- Back to home -->
    <div class="mt-6 text-center text-xs text-slate-500">
      <a href="/" class="text-blue-700 hover:underline">&larr; Return to Home Overview</a>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    const DEMO_PASSWORD = "Demo@AICTE2026!";

    function fillCredentials(email) {
      document.getElementById("email").value = email;
      document.getElementById("password").value = DEMO_PASSWORD;
      showAlert(`Filled credentials for ${email}`, "info");
    }

    function showAlert(msg, type = "error") {
      const box = document.getElementById("alert-box");
      box.classList.remove("hidden", "bg-red-50", "text-red-700", "border-red-200", "bg-emerald-50", "text-emerald-700", "border-emerald-200", "bg-blue-50", "text-blue-700", "border-blue-200");
      
      if (type === "error") {
        box.classList.add("bg-red-50", "text-red-700", "border", "border-red-200");
      } else if (type === "success") {
        box.classList.add("bg-emerald-50", "text-emerald-700", "border", "border-emerald-200");
      } else {
        box.classList.add("bg-blue-50", "text-blue-700", "border", "border-blue-200");
      }
      box.textContent = msg;
    }

    // Auto-redirect if already logged in
    document.addEventListener("DOMContentLoaded", () => {
      const user = API.getUser();
      const token = API.getToken();
      if (user && token) {
        window.location.href = API.getRedirectUrlForRole(user.role);
      }
    });

    // Form submission
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("submit-btn");

      btn.disabled = true;
      btn.innerHTML = `<span>Authenticating...</span>`;

      try {
        const res = await API.login(email, password);
        showAlert("Authentication successful! Redirecting...", "success");
        setTimeout(() => {
          window.location.href = API.getRedirectUrlForRole(res.user.role);
        }, 300);
      } catch (err) {
        showAlert(err.message || "Invalid email or password", "error");
        btn.disabled = false;
        btn.innerHTML = `<span>Sign In</span>`;
      }
    });
  </script>
</body>
</html>
